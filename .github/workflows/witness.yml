name: Solana Mainnet Independent Cloud Witness
on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  mainnet_rpc_witness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Execute Live JSON-RPC Query on Official Solana Mainnet with Strict TLS & Assertion Checks
        run: |
          echo "=== GITHUB ACTIONS NEUTRAL CLOUD WITNESS ===" > CLOUD_WITNESS_META.txt
          echo "Runner OS: $(uname -a)" >> CLOUD_WITNESS_META.txt
          echo "GitHub Run ID: ${{ github.run_id }}" >> CLOUD_WITNESS_META.txt
          echo "Timestamp UTC: $(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> CLOUD_WITNESS_META.txt

          node query_mainnet.js
          sha256sum LIVE_MAINNET_CLOUD_WITNESS.json >> CLOUD_WITNESS_META.txt
          sha256sum TLS_SESSION_PROVENANCE.json >> CLOUD_WITNESS_META.txt
          cat CLOUD_WITNESS_META.txt

      - name: Cryptographic Artifact Attestation by GitHub / Sigstore (SLSA Provenance)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            LIVE_MAINNET_CLOUD_WITNESS.json
            TLS_SESSION_PROVENANCE.json

      - name: Export and Independently Verify Sigstore Attestation Bundle
        run: |
          gh attestation verify LIVE_MAINNET_CLOUD_WITNESS.json --repo ${{ github.repository }} --format json > ATTESTATION_SIGSTORE_BUNDLE.json
          node verify_attestation.js
          sha256sum ATTESTATION_SIGSTORE_BUNDLE.json >> CLOUD_WITNESS_META.txt
          sha256sum SIGSTORE_VERIFICATION_REPORT.txt >> CLOUD_WITNESS_META.txt
          cat SIGSTORE_VERIFICATION_REPORT.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit Cloud-Captured Artifacts by github-actions[bot]
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LIVE_MAINNET_CLOUD_WITNESS.json TLS_SESSION_PROVENANCE.json ATTESTATION_SIGSTORE_BUNDLE.json SIGSTORE_VERIFICATION_REPORT.txt CLOUD_WITNESS_META.txt
          git commit -m "chore(witness): verified Solana Mainnet RPC capture with dual Sigstore attestation and TLS provenance [skip ci]" || true
          git push origin main
